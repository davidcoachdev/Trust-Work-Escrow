[package]
name = "trust-work-escrow-app"
version = "0.1.0"
edition = "2021"
description = "Trust Work Escrow — Dioxus 0.7 fullstack (app + SDK + contrato devnet)"

[dependencies]
dioxus = { version = "=0.7.9", features = ["router"] }
dioxus-logger = "0.7"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Server — free, sin pagar
axum = { version = "0.8", features = ["ws"], optional = true }
tokio = { version = "1.0", features = ["full"], optional = true }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "tls-rustls"], optional = true }
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls", "builder", "smtp-transport", "pool", "ring", "webpki-roots"], optional = true }
jsonwebtoken = { version = "9", optional = true }
argon2 = { version = "0.5", optional = true }
rand = { version = "0.8", optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
hex = { version = "0.4", optional = true }
bs58 = "0.5"
ed25519-dalek = { version = "2", features = ["rand_core"] }
base64 = "0.22"
bip39 = { version = "2", features = ["rand"] }
zeroize = { version = "1", features = ["zeroize_derive"] }
dioxus-server = { version = "=0.7.9", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
once_cell = { version = "1.19", optional = true }

# SDK + contrato (devnet 7a2Y...)
trust-escrow-sdk = { path = "../backend/sdk", features = ["solana"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Document", "Storage", "Element", "HtmlElement", "Navigator", "Clipboard", "KeyboardEvent", "NodeList", "Node", "Event", "EventTarget"] }
wasm-bindgen = "0.2"
gloo-timers = { version = "0.3", features = ["futures"] }
getrandom = { version = "0.2", features = ["js"] }
bip39 = { version = "2", features = ["rand"] }
zeroize = { version = "1", features = ["zeroize_derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
bs58 = "0.5"


[features]
default = ["web"]
web = ["dioxus/web", "dioxus/fullstack"]
server = [
  "dioxus/server",
  "dioxus/fullstack",
  "dep:axum",
  "dep:tokio",
  "dep:sqlx",
  "dep:lettre",
  "dep:jsonwebtoken",
  "dep:argon2",
  "dep:rand",
  "dep:chrono",
  "dep:hex",
  "dep:once_cell",
  "dep:dioxus-server",
  "dep:reqwest",
  "dep:trust-escrow-sdk"
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
