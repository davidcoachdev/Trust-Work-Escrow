[package]
name = "trust-escrow-cli"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
anchor-client = { version = "0.32.1" }
solana-rpc-client = "2.3.1"
borsh = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[[bin]]
name = "escrow"
path = "src/main.rs"
