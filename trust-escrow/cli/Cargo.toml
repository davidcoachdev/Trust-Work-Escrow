[package]
name = "trust-escrow-cli"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
escrow-core = { path = "../escrow-core" }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "fmt",
    "ansi",
] }
tracing-appender = "0.2"
dirs = "6"

[[bin]]
name = "escrow"
path = "src/main.rs"
