[package]
name = "trust-escrow-tui"
version = "0.1.0"
edition = "2021"
description = "Interactive terminal UI for Trust Work Escrow on Solana"

[workspace]

[dependencies]
escrow-core = { path = "../escrow-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
anyhow = "1"
ratatui = "0.28"
crossterm = "0.28"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "fmt",
    "ansi",
] }
tracing-appender = "0.2"

[[bin]]
name = "escrow-tui"
path = "src/main.rs"
