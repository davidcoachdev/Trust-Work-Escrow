# Trust Work Escrow v3 — local backend stack
# Usage:
#   docker compose up --build   # build & run API + Postgres + MongoDB
#   docker compose down -v      # stop and remove named volumes

services:
  postgres:
    image: postgres:16-alpine
    container_name: twe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-twe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-twe}
      POSTGRES_DB: ${POSTGRES_DB:-trust_work_escrow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-twe} -d ${POSTGRES_DB:-trust_work_escrow}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - twe-net

  mongo:
    image: mongo:7
    container_name: twe-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-twe}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-twe}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-trust_work_escrow}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - twe-net

  api:
    build:
      context: .
      dockerfile: backend/api/Dockerfile # pinned toolchain: rust:1.89 — see rust-toolchain.toml / trust-escrow-v3/rust-toolchain.toml
    container_name: twe-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      PORT: ${API_PORT:-3000}
      DATABASE_URL: postgres://${POSTGRES_USER:-twe}:${POSTGRES_PASSWORD:-twe}@postgres:5432/${POSTGRES_DB:-trust_work_escrow}
      MONGO_URL: mongodb://${MONGO_USER:-twe}:${MONGO_PASSWORD:-twe}@mongo:27017/${MONGO_DB:-trust_work_escrow}?authSource=admin
      RUST_LOG: ${RUST_LOG:-trust_escrow_api=debug,tower_http=debug}
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - twe-net
    # resource limits: set via deploy.resources (example: cpus: '0.5', memory: 512M) — uncomment to enforce
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1.0'
    #       memory: 1G

networks:
  twe-net:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
