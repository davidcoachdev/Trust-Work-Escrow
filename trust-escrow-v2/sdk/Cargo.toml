[package]
name = "trust-escrow-sdk"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Rust SDK for Trust Work Escrow v2 - Type-safe Solana escrow operations"
license = "MIT"
repository = "https://github.com/trust-work/trust-escrow-v2"
keywords = ["solana", "escrow", "blockchain", "anchor", "web3"]
categories = ["cryptography::cryptocurrencies"]
readme = "README.md"

[lib]
name = "trust_escrow_sdk"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Anchor & Solana core - Match v2 contract versions
anchor-client = "0.30.0"
anchor-lang = "0.30.0"
solana-sdk = "1.18"
solana-client = "1.18"
solana-account-decoder = "1.18"

# Async runtime
tokio = { version = "1.0", features = ["full"], optional = true }

# Serialization & Crypto
serde = { version = "1.0", features = ["derive"], optional = true }
borsh = "1.0"
bs58 = "0.5"

# Error handling & utilities
thiserror = "1.0"
anyhow = "1.0"
lazy_static = "1.4"
dashmap = "6.0"

# Development dependencies
[dev-dependencies]
tokio-test = "0.4"
pretty_assertions = "1.4"

[features]
default = ["tokio", "serde"]
serde = ["dep:serde"]
async = ["tokio"]
dev = []

[build-dependencies]
# For IDL client generation
serde_json = "1.0"