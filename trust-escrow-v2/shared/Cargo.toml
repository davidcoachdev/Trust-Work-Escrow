[package]
name = "trust-escrow-shared"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Shared utilities for Trust Work Escrow CLI/TUI applications"
authors = ["Trust Work Team <dev@trustwork.com>"]

[dependencies]
# Epic #2 SDK integration
trust-escrow-sdk = { path = "../sdk" }

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Directory utilities
dirs = "5.0"

# Solana SDK
solana-sdk = "1.18"
solana-client = "1.18"

# String utilities for config paths
shellexpand = "3.1"

# Logging
env_logger = "0.11"
log = "0.4"