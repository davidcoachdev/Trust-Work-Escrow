version: 2
updates:
  # Docker (Dockerfile del dev container)
  - package-ecosystem: "docker"
    directory: "/.devcontainer"
    schedule:
      interval: "weekly"

  # GitHub Actions (workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Rust/Cargo (programa Anchor + backend)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"

  # npm (app + frontend)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

  # Dev Containers
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
