# ═══════════════════════════════════════════════════════════════
# secret-scan.yml — Gitleaks secret scanning + 0600 permission audit
# T19: asegura que logs no filtren secrets, archivos sensibles 0600, scan en CI
# ═══════════════════════════════════════════════════════════════

name: Secret Scan

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]
  schedule:
    # Diario 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: Gitleaks — detect secrets
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks (scan repo + history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: detect --source . --no-banner --redact --verbose --config .gitleaks.toml

      - name: Fallback — script local si gitleaks no está configurado
        if: failure()
        run: |
          if [ -f scripts/secret-scan.sh ]; then
            chmod +x scripts/secret-scan.sh
            ./scripts/secret-scan.sh --ci
          else
            echo "scripts/secret-scan.sh no encontrado, revisión manual de patterns"
            # Lightweight fallback: grep patterns sensibles no permitidos en código
            set +e
            FOUND=0
            for pat in "BEGIN PRIVATE KEY" "BEGIN RSA PRIVATE KEY" "BEGIN EC PRIVATE KEY" "aws_secret_access_key" "sk-[a-zA-Z0-9]{20}"; do
              if grep -R --exclude-dir=target --exclude-dir=.git --exclude="*.lock" -n "$pat" . ; then
                echo "::error::Pattern sensible detectado: $pat"
                FOUND=1
              fi
            done
            if [ $FOUND -ne 0 ]; then exit 1; fi
          fi

  permission-audit:
    name: Audit 0600 permissions for sensitive files
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check sensitive file permissions
        run: |
          chmod +x scripts/check-permissions.sh || true
          ./scripts/check-permissions.sh --ci || {
            echo "::error::Archivos sensibles sin permisos 0600 detectados"
            exit 1
          }

  backend-logging-tests:
    name: Backend secure logging tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: cargo-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock') }}

      - name: Run backend secure logging tests
        working-directory: backend
        run: cargo test -p trust-escrow-api logging -- --nocapture

      - name: Clippy (no warnings)
        working-directory: backend
        run: cargo clippy -p trust-escrow-api -- -D warnings

      - name: Verify no secrets in logs helper
        working-directory: backend
        run: |
          # Ensure error.rs sanitize delegates to logging::redact_secrets
          if ! grep -q "logging::redact_secrets" api/src/error.rs; then
            echo "::error::error.rs debe delegar a logging::redact_secrets"
            exit 1
          fi
          echo "✓ Redaction wiring verified"
