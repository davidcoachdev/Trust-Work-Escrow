# Gitleaks config — Trust Work Escrow T19
# Extiende el config base; añade allowlist para patrones de prueba

title = "Trust Work Escrow gitleaks config"

[extend]
# usa config base de gitleaks

[[rules]]
id = "solana-private-key-array"
description = "Solana keypair JSON byte array"
regex = '''\[\s*\d{1,3}\s*(,\s*\d{1,3}\s*){31,}\]'''
tags = ["key", "solana"]

[[rules]]
id = "pem-private-key"
description = "PEM private key block"
regex = '''-----BEGIN [^-]+ PRIVATE KEY-----'''
tags = ["key", "pem"]

[allowlist]
description = "Allowlist for test fixtures and docs"
paths = [
  '''\.gitleaks\.toml''',
  '''backend/api/src/logging\.rs''',
  '''scripts/secret-scan\.sh''',
  '''.*\.md$''',
]
# Hashes de ejemplo en tests (no secretos reales)
regexes = [
  '''7a2YhCd7iivXfyySkp1pf5jj''',
  '''sk-1234567890abcdef''',
  '''eyJ[A-Za-z0-9_\-]{10,}''',
]
# Commits o archivos generados que contienen ejemplos redactados
commits = []
